name: Android

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:build:android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux FFmpeg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl git make nasm ninja-build pkg-config python3 unzip xz-utils yasm
      - name: Assemble Android debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: transversa-android-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
