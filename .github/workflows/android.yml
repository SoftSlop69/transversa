# SPDX-License-Identifier: GPL-3.0-or-later
name: Android

on:
  push:
    branches: [main, codex/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux FFmpeg build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl git make nasm ninja-build pkg-config python3 unzip xz-utils yasm
      - name: Assemble Android debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

